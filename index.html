<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport wajib untuk tampilan mobile agar tidak zoomed-out -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Embedded Content</title>
    <style>
        /* Menghilangkan margin dan mematikan scrollbar bawaan body */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* Container iframe fleksibel untuk mendeteksi layar mobile/desktop */
        .iframe-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Mendukung layar HP dengan dynamic viewport height (dvh) */
            height: 100dvh; 
            border: none;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbxRMvBdRo3h0-FRPKsn15C9XQlkAiHzN4RCbMSMz-f0qDvoctngouyQSoyJYenqUBON/exec"
            allow="fullscreen; autoplay; camera; microphone"
            allowfullscreen="true">
        </iframe>
    </div>

</body>
</html>
