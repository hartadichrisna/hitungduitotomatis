<!DOCTYPE html>
<html>
<head>
<title>Embedded Content</title>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbxRMvBdRo3h0-FRPKsn15C9XQlkAiHzN4RCbMSMz-f0qDvoctngouyQSoyJYenqUBON/exec"
width="100%";
height="100%";
overflow: hidden;
allowfullscreen="true"
style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; border: none;"></iframe>
<script>
window.onload = function() {
document.querySelector('iframe').requestFullscreen().catch((err) => {
console.error(`Error attempting to enable full-screen mode: ${err.message}`);
});
};
</script>
</body>
</html>
